name: WaveField saved-size host regression
on:
  push:
  pull_request:
jobs:
  host-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -p 'test_wavefield_size_load.py' -v
